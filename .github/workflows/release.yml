# The release: the plugin's zip and the splat node's script on a GitHub release, the splat node's image on
# ghcr.io (one per trainer: OpenSplat and LichtFeld Studio), and the documentation site on GitHub Pages.
# Runs only for a pushed tag v<the plugin's version> (as in splatme/manifest.json), or by hand (Actions > Release >
# Run workflow), never for an ordinary push or a pull request. By hand it builds all three and publishes nothing,
# unless "Push the splat node's image" or "Publish the documentation" is ticked.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Push the splat node's image to ghcr.io (its version and latest)"
        type: boolean
        default: false
      publish_docs:
        description: "Publish the documentation site to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time: two tags pushed close together would race to move latest
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plugin:
    name: The plugin's zip
    # After both of the node's images are published and pullable without a login: the release's splatnode.sh
    # (releases/latest) must not install an image not yet there. On a run by hand that publishes no image, after
    # both are built
    needs: [node, publish]
    if: ${{ !cancelled() && needs.node.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the zip
        run: |
          # A tag's version must be the manifest's
          version=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          dev/build-zip.sh HEAD "$version"
          zip="$(basename dist/splatme-*.zip)"
          echo "zip=$zip" >> "$GITHUB_ENV"
          echo "### $zip" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 \`$(cut -d' ' -f1 "dist/$zip.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The node's script too: the docs fetch it from releases/latest, never from main. A run again for the
          # same tag replaces the release's files.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$zip" "dist/$zip.sha256" node/splatnode.sh --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/$zip" "dist/$zip.sha256" node/splatnode.sh \
              --verify-tag --title "SplatMe ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  node:
    name: The splat node's image (${{ matrix.trainer }})
    runs-on: ubuntu-24.04
    # LichtFeld Studio's build took 66 minutes on a GitHub runner, OpenSplat's 12 (2026-11-27): about twice that
    timeout-minutes: 130
    permissions:
      packages: write  # to push the image
    strategy:
      # One image failing does not cancel the other (its log stays whole); nothing is published unless both build
      fail-fast: false
      matrix:
        include:
          - trainer: opensplat
            dockerfile: node/Dockerfile
            image: splatme-node
            description: "SplatMe's splat node: OpenSplat on an NVIDIA GPU, for WebODM"
            licenses: AGPL-3.0-only
            trainer_repo: https://github.com/WebODM/OpenSplat
            commit_arg: OPENSPLAT_COMMIT
          - trainer: lichtfeld
            dockerfile: node/lichtfeld.Dockerfile
            image: splatme-node-lichtfeld
            description: "SplatMe's splat node: LichtFeld Studio on an NVIDIA GPU, for WebODM"
            # SplatMe's node, and LichtFeld Studio (its NVIDIA library exception is in the image, /opt/lichtfeld)
            licenses: AGPL-3.0-only AND GPL-3.0-or-later
            trainer_repo: https://github.com/MrNeRF/LichtFeld-Studio
            commit_arg: LFS_COMMIT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: A tag's version must be the plugin's
        if: github.ref_type == 'tag'
        run: |
          # Before anything is pushed: a mistyped tag must not move the node's latest with no release behind it
          manifest="$(python3 -c 'import json; print(json.load(open("splatme/manifest.json"))["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$manifest, the version in splatme/manifest.json."
            exit 1
          fi
      - name: The image's name and version
        id: image
        run: |
          # ghcr.io names are lower case; the node's version is its own (node/splatnode.py's VERSION), the same
          # for both images
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          version="$(python3 -c 'import re; print(re.search(r"^VERSION = \"(.+)\"", open("node/splatnode.py").read(), re.M).group(1))')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # What goes into the image, as one hash: the image carries it, so a published version can be compared
          echo "inputs=$(cat "${{ matrix.dockerfile }}" node/splatnode.py | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # The trainer's source, at the commit the Dockerfile builds (its source offer, with this recipe)
          commit="$(sed -n 's/^ARG ${{ matrix.commit_arg }}=\([0-9a-f]\{40\}\)$/\1/p' "${{ matrix.dockerfile }}")"
          if [ -z "$commit" ]; then
            echo "::error::No ARG ${{ matrix.commit_arg }}=<commit> in ${{ matrix.dockerfile }}."
            exit 1
          fi
          echo "trainer_source=${{ matrix.trainer_repo }}/tree/$commit" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "${{ inputs.publish_image }}" = true ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        if: steps.image.outputs.publish == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Skip a version already published
        id: published
        if: steps.image.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A plugin-only release leaves the node's version as it was: its image is not built again. A version's
          # image is built once, so a change to what goes in it (its Dockerfile, node/splatnode.py) needs a new
          # VERSION, or it would never be published: the published image's inputs must be these.
          name="${{ steps.image.outputs.name }}"; version="${{ steps.image.outputs.version }}"
          # FOUND: what --format shows of a published tag, or nothing when it is not published ("not found", as
          # ghcr.io words a missing tag). A package never published (the first release of an image) may be worded
          # otherwise: it counts as not published only when the GitHub API says the package does not exist. Any
          # other error (ghcr.io not answering) ends the job: a published version must never be built over. (It sets
          # FOUND rather than printing it: an exit in $(...) would end only the subshell.)
          inspect() {
            local out
            FOUND=""
            if out="$(docker buildx imagetools inspect "$name:$1" --format "$2" 2>&1)"; then
              FOUND="$out"
            elif printf '%s' "$out" | grep -q ': not found$'; then
              :
            elif ! package_exists; then
              echo "::notice::$name has never been published: $out"
            else
              echo "::error::ghcr.io did not say whether $name:$1 is published: $out"
              exit 1
            fi
          }
          # Whether the package exists: the API answers 404 for one that does not (any other failure: it may)
          package_exists() {
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/${{ matrix.image }}")"
            [ "$code" != 404 ]
          }
          version_label='{{index .Image.Config.Labels "org.opencontainers.image.version"}}'
          # latest moves only forward: never to a version older than the one it is (a tag on an older commit, a run by hand)
          inspect latest "$version_label"; current="$FOUND"
          move=false
          if [ -z "$current" ] || [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)" = "$version" ]; then move=true; fi
          echo "move_latest=$move" >> "$GITHUB_OUTPUT"
          [ "$move" = true ] || echo "latest stays at the splat node $current, newer than $version." >> "$GITHUB_STEP_SUMMARY"
          inspect "$version" '{{.Name}}'
          if [ -n "$FOUND" ]; then
            inspect "$version" '{{index .Image.Config.Labels "splatme.node.inputs"}}'; inputs="$FOUND"
            if [ -z "$inputs" ]; then
              echo "::notice::The splat node $version was published before images carried their inputs: not compared."
            elif [ "$inputs" != "${{ steps.image.outputs.inputs }}" ]; then
              echo "::error::${{ matrix.dockerfile }} or node/splatnode.py changed since the splat node $version was published: raise VERSION in node/splatnode.py."
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The splat node $version is already published: not built again." >> "$GITHUB_STEP_SUMMARY"
            # latest is that version (a run whose second push failed left it behind)
            if [ "$move" = true ]; then docker buildx imagetools create -t "$name:latest" "$name:$version"; fi
          fi
      - name: Make room on the runner
        if: steps.published.outputs.skip != 'true'
        run: |
          # The build stage (CUDA's devel image, libtorch or vcpkg's ports) needs more disk than the runner has free
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /
      - name: Build the image
        if: steps.published.outputs.skip != 'true'
        run: |
          docker build node -f "${{ matrix.dockerfile }}" \
            -t "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" \
            -t "${{ steps.image.outputs.name }}:latest" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=${{ matrix.description }}" \
            --label "org.opencontainers.image.licenses=${{ matrix.licenses }}" \
            --label "splatme.trainer.source=${{ steps.image.outputs.trainer_source }}" \
            --label "org.opencontainers.image.version=${{ steps.image.outputs.version }}" \
            --label "splatme.node.inputs=${{ steps.image.outputs.inputs }}"
          docker image ls "${{ steps.image.outputs.name }}"
      - name: Push the image under this run's tag
        if: steps.image.outputs.publish == 'true' && steps.published.outputs.skip != 'true'
        run: |
          # Not its version nor latest yet: the publish job gives it those once both images are built, so one image
          # failing publishes neither (an upgrade would otherwise get a node with no plugin release behind it)
          name="${{ steps.image.outputs.name }}"
          docker tag "$name:${{ steps.image.outputs.version }}" "$name:run-$GITHUB_RUN_ID"
          docker push "$name:run-$GITHUB_RUN_ID"

  publish:
    name: Publish the splat node's images
    # Once both images are built (needs waits for every matrix entry and fails if one did)
    needs: node
    if: github.ref_type == 'tag' || inputs.publish_image
    runs-on: ubuntu-24.04
    permissions:
      packages: write  # to tag the images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Give this run's images their version and latest
        run: |
          version="$(python3 -c 'import re; print(re.search(r"^VERSION = \"(.+)\"", open("node/splatnode.py").read(), re.M).group(1))')"
          for image in splatme-node splatme-node-lichtfeld; do
            name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image"
            # An image this run built (one already published was skipped, and keeps its tags)
            docker buildx imagetools inspect "$name:run-$GITHUB_RUN_ID" >/dev/null 2>&1 || continue
            docker buildx imagetools create -t "$name:$version" "$name:run-$GITHUB_RUN_ID"
            echo "### \`$name:$version\`" >> "$GITHUB_STEP_SUMMARY"
            # latest moves only forward
            current="$(docker buildx imagetools inspect "$name:latest" --format '{{index .Image.Config.Labels "org.opencontainers.image.version"}}' 2>/dev/null || true)"
            if [ -z "$current" ] || [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)" = "$version" ]; then
              docker buildx imagetools create -t "$name:latest" "$name:run-$GITHUB_RUN_ID"
              echo "and \`latest\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: The images can be pulled without a login
        run: |
          # A package's first publication is private on ghcr.io: an administrator's install would then fail. Checked
          # before the plugin's release is made: set it public (the package's settings) and run the release again
          docker logout ghcr.io
          version="$(python3 -c 'import re; print(re.search(r"^VERSION = \"(.+)\"", open("node/splatnode.py").read(), re.M).group(1))')"
          for image in splatme-node splatme-node-lichtfeld; do
            name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image"
            if ! out="$(docker buildx imagetools inspect "$name:$version" 2>&1)"; then
              echo "::error::$name:$version can't be pulled without a login (a private package?): $out"
              exit 1
            fi
          done

  docs:
    name: The documentation site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the site
        run: |
          # The runner's own Python (3.12); Zensical and what it pulls in, as locked with hashes
          python3 -m venv /tmp/docs
          /tmp/docs/bin/pip install --require-hashes --no-deps -r docs/requirements.txt
          # Strict (zensical.toml): a broken link or anchor fails the build
          /tmp/docs/bin/zensical build --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  docs-deploy:
    name: Publish the documentation
    # With the release: once its files are up, so the docs' commands fetch what they describe
    needs: [docs, plugin]
    if: github.ref_type == 'tag' || inputs.publish_docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write     # to deploy to Pages
      id-token: write  # to verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        id: deployment
