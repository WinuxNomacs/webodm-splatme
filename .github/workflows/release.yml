# The release: the plugin's zip and the splat node's script on a GitHub release, the splat node's image on
# ghcr.io, and the documentation site on GitHub Pages.
# Runs only for a pushed tag v<the plugin's version> (as in splatme/manifest.json), or by hand (Actions > Release >
# Run workflow), never for an ordinary push or a pull request. By hand it builds all three and publishes nothing,
# unless "Push the splat node's image" or "Publish the documentation" is ticked.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Push the splat node's image to ghcr.io (its version and latest)"
        type: boolean
        default: false
      publish_docs:
        description: "Publish the documentation site to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plugin:
    name: The plugin's zip
    # After the node's image: the release's splatnode.sh (releases/latest) must not install an image not yet there
    needs: node
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the zip
        run: |
          # A tag's version must be the manifest's
          version=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          dev/build-zip.sh HEAD "$version"
          zip="$(basename dist/splatme-*.zip)"
          echo "zip=$zip" >> "$GITHUB_ENV"
          echo "### $zip" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 \`$(cut -d' ' -f1 "dist/$zip.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The node's script too: the docs fetch it from releases/latest, never from main. A run again for the
          # same tag replaces the release's files.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$zip" "dist/$zip.sha256" node/splatnode.sh --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/$zip" "dist/$zip.sha256" node/splatnode.sh \
              --verify-tag --title "SplatMe ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  node:
    name: The splat node's image
    runs-on: ubuntu-24.04
    permissions:
      packages: write  # to push the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: A tag's version must be the plugin's
        if: github.ref_type == 'tag'
        run: |
          # Before anything is pushed: a mistyped tag must not move the node's latest with no release behind it
          manifest="$(python3 -c 'import json; print(json.load(open("splatme/manifest.json"))["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$manifest, the version in splatme/manifest.json."
            exit 1
          fi
      - name: The image's name and version
        id: image
        run: |
          # ghcr.io names are lower case; the node's version is its own (node/splatnode.py's VERSION)
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/splatme-node"
          version="$(python3 -c 'import re; print(re.search(r"^VERSION = \"(.+)\"", open("node/splatnode.py").read(), re.M).group(1))')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # What goes into the image, as one hash: the image carries it, so a published version can be compared
          echo "inputs=$(cat node/Dockerfile node/splatnode.py | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "${{ inputs.publish_image }}" = true ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        if: steps.image.outputs.publish == 'true'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Skip a version already published
        id: published
        if: steps.image.outputs.publish == 'true'
        run: |
          # A plugin-only release leaves the node's version as it was: its image is not built again. A version's
          # image is built once, so a change to what goes in it (node/Dockerfile, node/splatnode.py) needs a new
          # VERSION, or it would never be published: the published image's inputs must be these.
          name="${{ steps.image.outputs.name }}"; version="${{ steps.image.outputs.version }}"
          if docker manifest inspect "$name:$version" >/dev/null 2>&1; then
            published="$(docker buildx imagetools inspect "$name:$version" --format '{{index .Image.Config.Labels "splatme.node.inputs"}}')"
            if [ -z "$published" ]; then
              echo "::notice::The splat node $version was published before images carried their inputs: not compared."
            elif [ "$published" != "${{ steps.image.outputs.inputs }}" ]; then
              echo "::error::node/Dockerfile or node/splatnode.py changed since the splat node $version was published: raise VERSION in node/splatnode.py."
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The splat node $version is already published: not built again." >> "$GITHUB_STEP_SUMMARY"
            # latest is that version (a run whose second push failed left it behind)
            docker buildx imagetools create -t "$name:latest" "$name:$version"
          fi
      - name: Make room on the runner
        if: steps.published.outputs.skip != 'true'
        run: |
          # The build stage (CUDA's devel image, libtorch) needs more disk than the runner has free
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /
      - name: Build the image
        if: steps.published.outputs.skip != 'true'
        run: |
          docker build node \
            -t "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" \
            -t "${{ steps.image.outputs.name }}:latest" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=SplatMe's splat node: OpenSplat on an NVIDIA GPU, for WebODM" \
            --label "org.opencontainers.image.licenses=AGPL-3.0" \
            --label "org.opencontainers.image.version=${{ steps.image.outputs.version }}" \
            --label "splatme.node.inputs=${{ steps.image.outputs.inputs }}"
          docker image ls "${{ steps.image.outputs.name }}"
      - name: Push the image
        if: steps.image.outputs.publish == 'true' && steps.published.outputs.skip != 'true'
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
          docker push "${{ steps.image.outputs.name }}:latest"
          echo "### The splat node" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}\` and \`latest\`" >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: The documentation site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the site
        run: |
          # The runner's own Python (3.12); Zensical and what it pulls in, as locked with hashes
          python3 -m venv /tmp/docs
          /tmp/docs/bin/pip install --require-hashes --no-deps -r docs/requirements.txt
          # Strict (zensical.toml): a broken link or anchor fails the build
          /tmp/docs/bin/zensical build --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  docs-deploy:
    name: Publish the documentation
    # With the release: once its files are up, so the docs' commands fetch what they describe
    needs: [docs, plugin]
    if: github.ref_type == 'tag' || inputs.publish_docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write     # to deploy to Pages
      id-token: write  # to verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        id: deployment
